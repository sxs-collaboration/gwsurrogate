# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_checkout:
      # Tell git to use https instead of ssh
      - git config --global url."https://github.com/".insteadOf "git@github.com:"
      - git submodule init
      - git submodule update

# Build documentation with Mkdocs
mkdocs:
   configuration: mkdocs.yml

# Optionally, but recommended,
# declare the Python requirements required to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
   install:
    - method: pip
      path: .
      extra_requirements:
        - docs

# Don't use the submodules section, because we use post_checkout above to
# instruct git to use https instead of ssh. We don't have a chance to run git
# config before the RTD code handles the submodules section below,  which is why
# we use the post_checkout hook above to do it manually.

# # Tell Read the Docs to clone submodules
# submodules:
#   include: all
#   recursive: true
